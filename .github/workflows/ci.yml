name: CI

# Pre-merge validation for pull requests. Pushes to main are validated by the
# `test` job in deploy.yml (which gates the build + VPS deploy), so we don't
# duplicate the full quality gate here on main.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      # Placeholder public config so the production build exercises the real
      # code paths (Supabase-configured mode) without any secrets. No network
      # calls happen at build time — data fetching is client-side/dynamic.
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: roommate-assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Dependency audit (production deps, fail on high)
        run: npm audit --omit=dev --audit-level=high
