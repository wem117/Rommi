name: Build and Deploy Telegram Import Service

# Mirrors .github/workflows/deploy.yml's shape (test -> build/push -> SSH
# deploy) as a COMPLETELY SEPARATE pipeline, scoped to telegram-service/** so a
# change here can never trigger (or block) the main Next.js app's deploy, and
# vice versa.
on:
  push:
    branches:
      - main
    paths:
      - "telegram-service/**"
      # The schema this service depends on ships with it (see the migrate step
      # below), so a migration-only change must be able to trigger the deploy on
      # its own — otherwise the worker boots against a database missing columns
      # it writes.
      - "supabase/migrations/*telegram*.sql"
      - ".github/workflows/deploy-telegram-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-telegram-service
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # 1) Quality gate.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-service
    env:
      # Placeholder credentials so imports/tests exercise real code paths with
      # no network calls and nothing real to leak — see tests/conftest.py.
      #
      # Each value is DISTINCT, and in particular no secret is a substring of the
      # Supabase URL. tests/test_db_errors.py asserts that error messages quote
      # the host but never the service-role key; reusing one "ci-placeholder"
      # string for both made that assertion fire on its own fixture, which is a
      # false positive that would train everyone to ignore a genuine leak test.
      TELEGRAM_API_ID: "12345"
      TELEGRAM_API_HASH: "ci-placeholder-api-hash"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Unit tests
        run: python -m pytest -v

      # Two workflow mistakes have already reached main: a `#` comment inside a
      # backslash-continued `docker run` (which destroyed the container and
      # then failed before starting its replacement), and an Actions expression
      # written literally inside a comment (which makes the whole file
      # unparseable). actionlint catches the second class outright, and every
      # other expression/syntax fault with it.
      - name: Lint the workflow files
        working-directory: .
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7
          ./actionlint -color

      # The deploy script is a 200-line bash program embedded in YAML, and
      # nothing type-checks it. A `#` comment placed inside a backslash-
      # continued `docker run` once removed the running container and then
      # failed before starting its replacement — `bash -n` accepts that
      # happily (it is valid syntax), and shellcheck flags it as SC2215.
      - name: Shellcheck the embedded deploy script
        working-directory: .
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, re, yaml
          doc = yaml.safe_load(pathlib.Path(".github/workflows/deploy-telegram-service.yml").read_text())
          out = pathlib.Path("/tmp/deploy-script.sh")
          for step in doc["jobs"]["deploy"]["steps"]:
              script = (step.get("with") or {}).get("script")
              if not script:
                  continue
              # Actions expressions are not shell; substitute them out so bash
              # can parse what is left. The pattern is written with escapes
              # rather than spelled literally because Actions evaluates that
              # syntax ANYWHERE in a run: block, including inside a comment —
              # writing it plainly here makes the whole workflow file invalid.
              out.write_text("#!/bin/bash\n" + re.sub(r"\$\{\{[^}]*\}\}", "GH_EXPR", script))
          PY
          bash -n /tmp/deploy-script.sh
          shellcheck -S warning /tmp/deploy-script.sh

      - name: Import smoke test (catches import-time errors tests don't reach)
        run: |
          python -c "
          import app.config, app.db, app.telethon_client, app.media, app.albums, app.main
          import telegram_listener
          import telegram_parser
          assert hasattr(telegram_listener, 'listen_messages')
          assert hasattr(telegram_listener, 'process_group')
          assert hasattr(telegram_listener, 'download_media')
          assert hasattr(telegram_listener, 'create_draft_listing')
          # No AI provider may creep back in: the whole point of the
          # deterministic parser is that there is no key, quota or vendor.
          import sys
          banned = [m for m in sys.modules if m.split('.')[0] in
                    ('google', 'openai', 'anthropic', 'cohere', 'mistralai', 'litellm')]
          assert not banned, f'AI SDK imported by the service: {banned}'
          print('OK')
          "

  # 2) Build + push the image.
  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          # GITHUB_REPOSITORY is literally "yeraly218/RoommateKZ." (trailing
          # dot) — strip it BEFORE appending the suffix, or the dot ends up
          # stranded mid-string (roommatekz.-telegram-service), which is not a
          # valid image reference.
          name="${GITHUB_REPOSITORY,,}"
          name="${name%.}"
          name="${name}-telegram-service"
          echo "image=${{ env.REGISTRY }}/${name}" >> "$GITHUB_OUTPUT"

      # Uses the automatic, run-scoped GITHUB_TOKEN rather than GHCR_PAT (as
      # the main deploy.yml does): this is the FIRST push of this package name
      # (ghcr.io/.../roommatekz-telegram-service), and GHCR requires
      # create_package rights to push a brand-new package — GITHUB_TOKEN gets
      # that automatically from this workflow's own `permissions:
      # packages: write` (both top-level and on this job), with no extra
      # secret/scope configuration needed. GHCR_PAT works for the existing
      # roommatekz package (it was created once, long ago, likely via a token
      # that had create rights at the time) but returned "permission_denied:
      # create_package" for this new one. The resulting package follows normal
      # GHCR visibility rules afterward, so the deploy job's later `docker
      # pull` (still using GHCR_PAT, which already has read access proven by
      # the sibling image) is unaffected.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: telegram-service
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=telegram-service
          cache-to: type=gha,mode=max,scope=telegram-service

  # 3) Deploy to the SAME VPS the web app runs on, as an independent container.
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Ship the schema with the code that depends on it.
      #
      # This closes the gap that caused the PGRST205 incident: nothing in CI
      # applied migrations, and supabase/migrations/README.md documented only
      # `supabase link --project-ref` + `db push` — a HOSTED-Supabase workflow.
      # Production is self-hosted behind api.roomi.kz, so following the documented
      # procedure applied the telegram tables to a different database entirely.
      # PostgREST on prod was right all along: those tables did not exist there.
      #
      # Scoped to *telegram*.sql on purpose. This pipeline owns the Telegram
      # feature's schema and nothing else — it must never replay unrelated Roomi
      # migrations against a live database as a side effect of deploying a
      # Python worker.
      - name: Bundle Telegram migrations
        id: mig
        run: |
          set -euo pipefail
          ls supabase/migrations/*telegram*.sql
          # Lexicographic glob order == timestamp order, which is apply order.
          cat supabase/migrations/*telegram*.sql > /tmp/telegram-migrations.sql
          echo "b64=$(base64 -w0 /tmp/telegram-migrations.sql)" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          MIG_B64: ${{ steps.mig.outputs.b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MIG_B64
          script: |
            set -euo pipefail
            IMAGE="${{ needs.build-and-push.outputs.image }}:sha-${{ github.sha }}"
            APP_DIR=~/app/roomi-telegram-service
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            umask 077

            # Carry forward anything the workflow does not own.
            #
            # This file is rewritten from scratch on every deploy, so a value set
            # by hand on the host is destroyed unless it is either in the heredoc
            # below or rescued here. That is how automatic publishing would have
            # died: INTERNAL_API_SECRET was configured on the box, the next
            # unrelated deploy dropped it, and the worker would have gone quietly
            # back to sending everything to review.
            PREV_SECRET="$(grep -m1 '^INTERNAL_API_SECRET=' "$APP_DIR/.env.production" 2>/dev/null | cut -d= -f2- || true)"
            PREV_APP_URL="$(grep -m1 '^ROOMI_APP_INTERNAL_URL=' "$APP_DIR/.env.production" 2>/dev/null | cut -d= -f2- || true)"

            cat > "$APP_DIR/.env.production" <<'ENVEOF'
            TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}
            TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_STORAGE_BUCKET }}
            SUPABASE_INTERNAL_URL=${{ secrets.SUPABASE_INTERNAL_URL }}
            INTERNAL_API_SECRET=${{ secrets.INTERNAL_API_SECRET }}
            ENVEOF
            chmod 600 "$APP_DIR/.env.production"
            sed -i -E '/^[A-Z_]+=$/d' "$APP_DIR/.env.production"

            # --- automatic publishing --------------------------------------
            # The worker calls the app to publish a cleared draft, so it needs
            # the app's internal address and the shared secret. Without BOTH it
            # fails closed: every draft goes to review, which is safe but silent.
            if ! grep -q '^INTERNAL_API_SECRET=' "$APP_DIR/.env.production" && [ -n "$PREV_SECRET" ]; then
              echo "INTERNAL_API_SECRET=$PREV_SECRET" >> "$APP_DIR/.env.production"
              echo "::notice::INTERNAL_API_SECRET restored from the host (no GitHub secret set)."
            fi
            if [ -n "$PREV_APP_URL" ]; then
              echo "ROOMI_APP_INTERNAL_URL=$PREV_APP_URL" >> "$APP_DIR/.env.production"
            elif docker inspect roomi-web >/dev/null 2>&1; then
              echo "ROOMI_APP_INTERNAL_URL=http://roomi-web:3000" >> "$APP_DIR/.env.production"
            fi
            if ! grep -q '^INTERNAL_API_SECRET=' "$APP_DIR/.env.production"; then
              echo "::warning::No INTERNAL_API_SECRET — automatic publishing is disabled and every import will wait for review. Set the INTERNAL_API_SECRET repository secret (the same value on the web deploy) to enable it."
            fi
            grep -q '^NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=' "$APP_DIR/.env.production" \
              || echo "NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=roommate-assets" >> "$APP_DIR/.env.production"

            # --- Internal Supabase route --------------------------------------
            # Identical reasoning (and probe) to deploy.yml: without this the
            # worker's PostgREST calls leave the host for Cloudflare and come
            # back, even though Supabase is one container away on
            # supabase_default. The SUPABASE_INTERNAL_URL secret is currently
            # unset, so the sed above strips the line and every REST call has
            # been taking the long way round.
            #
            # Self-configure only after PROVING the gateway is here: pointing the
            # service at a dead address would break every insert. curl without
            # -f treats Kong's 401 as success — an auth challenge proves it is
            # listening.
            if ! grep -q '^SUPABASE_INTERNAL_URL=' "$APP_DIR/.env.production"; then
              if docker network inspect supabase_default >/dev/null 2>&1 \
                 && curl -sS -o /dev/null --max-time 3 http://127.0.0.1:8000/rest/v1/ >/dev/null 2>&1; then
                echo "SUPABASE_INTERNAL_URL=http://kong:8000" >> "$APP_DIR/.env.production"
                echo "Internal Supabase route enabled: kong:8000 answered."
              else
                echo "::notice::No local Supabase gateway detected; the worker will use the public URL (correct, just slower)."
              fi
            fi

            # --- Apply the Telegram schema to the SELF-HOSTED Supabase --------
            # Runs BEFORE the container starts, so the listener never boots
            # against a database missing its tables.
            echo "$MIG_B64" | base64 -d > /tmp/telegram-migrations.sql

            # Locate the Supabase Postgres container rather than hardcoding a
            # name: the compose project prefix differs between Supabase's own
            # docker-compose revisions. Preferred match first, then any
            # postgres-flavoured image as a fallback.
            # Captured once, then matched twice: piping `docker ps` straight into
            # a command that exits early (awk ... exit / head -1) can SIGPIPE the
            # producer, and `set -o pipefail` above would turn that into a failed
            # deploy. The image match deliberately anchors on `postgres` so that
            # postgrest/postgrest — also on this network — is never selected.
            PS_OUT="$(docker ps --format '{{.Names}}\t{{.Image}}')"
            DB_CT="$(printf '%s\n' "$PS_OUT" | awk -F'\t' '$1 ~ /supabase-db/ {print $1; exit}')"
            if [ -z "$DB_CT" ]; then
              DB_CT="$(printf '%s\n' "$PS_OUT" \
                | awk -F'\t' '$2 ~ /(^|\/)(supabase\/)?postgres(:|$)/ {print $1; exit}')"
            fi
            if [ -z "$DB_CT" ]; then
              echo "FAILED: no Supabase Postgres container found on this host." >&2
              echo "Running containers:" >&2
              docker ps --format '  {{.Names}}\t{{.Image}}' >&2
              echo "The telegram tables cannot be created, and the listener would" >&2
              echo "crash-loop on PGRST205. Refusing to deploy a service that" >&2
              echo "cannot work. Apply supabase/migrations/*telegram*.sql to the" >&2
              echo "database behind api.roomi.kz, then re-run this workflow." >&2
              rm -f /tmp/telegram-migrations.sql
              exit 1
            fi
            echo "Applying Telegram migrations to container: $DB_CT"

            # ON_ERROR_STOP so a partial apply fails the deploy instead of
            # leaving a half-created schema behind. Both files are idempotent
            # (create ... if not exists / declarative grants), so re-running on
            # every deploy is safe and keeps prod in sync with the repo.
            if ! docker exec -i "$DB_CT" \
                 psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
                 < /tmp/telegram-migrations.sql; then
              echo "FAILED: migrations did not apply cleanly." >&2
              rm -f /tmp/telegram-migrations.sql
              exit 1
            fi
            rm -f /tmp/telegram-migrations.sql

            # Prove the tables are actually there before continuing. This is the
            # check whose absence let the original incident reach production.
            TCOUNT="$(docker exec -i "$DB_CT" psql -tAX -U postgres -d postgres \
              -c "select count(*) from information_schema.tables
                  where table_schema='public'
                    and table_name in ('telegram_sources','telegram_messages','telegram_listings');")"
            echo "Telegram tables present in production DB: $TCOUNT/3"
            if [ "$TCOUNT" != "3" ]; then
              echo "FAILED: expected 3 telegram tables, found $TCOUNT." >&2
              exit 1
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE"

            # Preserve the named volume across redeploys: the .session file it
            # holds is the whole point — this workflow must NEVER attempt to
            # (re)create it. If the volume is empty (first-ever deploy), the
            # container logs a clear error and /health reports listener:
            # "stopped" until the operator copies in a session created via
            # `python scripts/create_session.py` (see telegram-service/README.md).
            # Roll-forward with a way back. The old container is STOPPED and
            # renamed, not destroyed, so if the replacement fails to start or
            # never answers /health the previous one can be brought straight
            # back. Destroying it first — as this did until the listener spent
            # twenty minutes down — means any failure below is an outage that
            # only a human can end.
            #
            # It has to be stopped rather than left running: both bind
            # 127.0.0.1:8010, and the new container cannot start while the old
            # one holds the port.
            docker rm -f roomi-telegram-service-previous >/dev/null 2>&1 || true
            HAD_PREVIOUS=no
            if docker inspect roomi-telegram-service >/dev/null 2>&1; then
              docker stop roomi-telegram-service >/dev/null 2>&1 || true
              docker rename roomi-telegram-service roomi-telegram-service-previous
              HAD_PREVIOUS=yes
            fi

            rollback() {
              echo "::error::Deploy failed; restoring the previous container." >&2
              docker logs --tail 60 roomi-telegram-service >&2 2>/dev/null || true
              docker rm -f roomi-telegram-service >/dev/null 2>&1 || true
              if [ "$HAD_PREVIOUS" = yes ]; then
                docker rename roomi-telegram-service-previous roomi-telegram-service
                docker start roomi-telegram-service >/dev/null 2>&1 || true
                docker network connect supabase_default roomi-telegram-service 2>/dev/null || true
                echo "Previous container restored: $(curl -sS --max-time 5 http://127.0.0.1:8010/health || echo unreachable)" >&2
              fi
              exit 1
            }

            # --memory 384m, down from 512m. Dropping the Gemini SDK took the
            # image from 466 MB to 257 MB and the resident set with it: the
            # parser allocates nothing per message, photos stream through a
            # spooled temp file rather than a whole-image buffer, and the
            # Supabase client is one pooled instance instead of one per call.
            # Steady state is ~90 MB, so this keeps roughly 4x headroom.
            #
            # NOTE: every line below is one backslash-continued command. A `#`
            # comment cannot go inside it — the shell swallows the rest of the
            # line and `docker run` never receives its image argument. That
            # exact mistake removed the running container and then failed
            # before starting the replacement, taking the listener down until
            # it was restored by hand.
            docker run -d \
              --name roomi-telegram-service \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env.production" \
              --mount type=volume,source=roomi-telegram-session,target=/app/data \
              --memory 384m \
              --memory-swap 384m \
              --pids-limit 256 \
              --log-driver json-file \
              --log-opt max-size=20m \
              --log-opt max-file=5 \
              -p 127.0.0.1:8010:8000 \
              "$IMAGE" || rollback
            docker network connect supabase_default roomi-telegram-service 2>/dev/null || true
            docker logout ghcr.io || true

            # Two separate waits, because they mean different things.
            #
            # First: does the container serve at all? Failing that is a failed
            # deploy and rolls back.
            #
            # Second: has the LISTENER reached "connected"? That takes a second
            # or two longer than the HTTP server does — MTProto has to open its
            # own connection and authenticate off the session file. Reading the
            # body once, the moment /health first answers, races that and
            # reports "not connected yet" on a perfectly good deploy. A warning
            # that fires on healthy deploys is worse than no warning: it teaches
            # everyone to ignore the one that matters.
            echo "Waiting for the service to answer /health..."
            for _ in $(seq 1 30); do
              if curl -sS -o /tmp/telegram-health.json --max-time 5 http://127.0.0.1:8010/health; then
                break
              fi
              sleep 2
            done

            HEALTH_BODY="$(cat /tmp/telegram-health.json 2>/dev/null || true)"
            if [ -z "$HEALTH_BODY" ]; then
              echo "Deploy FAILED: the container never answered /health." >&2
              rollback
            fi

            echo "Waiting for the Telegram listener to connect..."
            for _ in $(seq 1 20); do
              case "$HEALTH_BODY" in
                *'"listener": "connected"'*|*'"listener":"connected"'*) break ;;
              esac
              sleep 3
              HEALTH_BODY="$(curl -sS --max-time 5 http://127.0.0.1:8010/health || echo "$HEALTH_BODY")"
            done

            # Only now is the old container surplus. Pruning here rather than
            # before the health check is what keeps the rollback possible.
            docker rm -f roomi-telegram-service-previous >/dev/null 2>&1 || true

            # `docker image prune -f` on its own removes only DANGLING images,
            # and every deploy tags its image `sha-<commit>` — so nothing was
            # ever reclaimed and each release leaked ~257MB. Combined with the
            # web pipeline doing the same, Docker reached 16GB on a 30GB box
            # that also runs Postgres, at 85% disk.
            KEEP_IMAGES=3
            IMAGE_REPO="${IMAGE%:*}"
            docker images --filter "reference=$IMAGE_REPO" \
                          --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' \
              | sort -r | tail -n +$((KEEP_IMAGES + 1)) | cut -f2 \
              | while read -r old_image; do
                  echo "Retiring old image: $old_image"
                  docker rmi "$old_image" >/dev/null 2>&1 || true
                done
            docker image prune -f
            docker builder prune -af --filter 'until=168h' >/dev/null 2>&1 || true
            df -h / | tail -1 | sed 's/^/Disk after retention: /'

            echo "Telegram service is live: $HEALTH_BODY"
            case "$HEALTH_BODY" in
              *'"listener": "connected"'*|*'"listener":"connected"'*)
                echo "Telegram listener is connected and authenticated."
                ;;
              *)
                echo "::warning::Container is up, but the Telegram listener is not connected yet (state reported above). If no session has been created, run 'python scripts/create_session.py' locally, then copy the .session file into the roomi-telegram-session volume and restart the container."
                ;;
            esac
