name: Build and Deploy Roomi to VPS

# Vercel-style pipeline: a push to main runs the full quality gate FIRST, and the
# image is only built and deployed to the VPS when tests/lint/typecheck/build all
# pass. A failing test blocks the deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Never run two deploys of main at once; let an in-flight deploy finish.
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # 1) Quality gate — blocks everything below if anything fails.
  test:
    runs-on: ubuntu-latest
    env:
      # Placeholder public config so the build exercises the real (Supabase-
      # configured) code paths without secrets. No network calls at build time.
      NEXT_PUBLIC_SITE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET: roommate-assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  # 2) Build + push the image — ONLY after the quality gate passes.
  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute image name from github.repository
        id: image
        run: |
          name="${GITHUB_REPOSITORY,,}"
          name="${name%.}"
          echo "image=${{ env.REGISTRY }}/${name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # An immutable per-commit tag alongside the moving `latest`. Without a
          # tag that pins one exact build, "roll back" has no target: `latest`
          # has already been overwritten by the release that broke, and the
          # previous image is unreachable by name. The deploy job pins the
          # container to the SHA tag and keeps the prior one for rollback.
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          # Every NEXT_PUBLIC_* the browser needs must be passed here: Next inlines
          # them at build time, so runtime-only values never reach the client bundle.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=https://roomi.kz
            NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
            NEXT_PUBLIC_GEOCODER_URL=${{ secrets.NEXT_PUBLIC_GEOCODER_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Deploy to the VPS — ONLY after a successful build/push.
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            # Pin to the immutable per-commit tag, never the moving `latest`, so
            # the running container is traceable to one exact build and the
            # previously-running image stays addressable for rollback.
            IMAGE="${{ needs.build-and-push.outputs.image }}:sha-${{ github.sha }}"
            APP_DIR=~/app/roomi
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # --- Runtime environment -------------------------------------------------
            # NEXT_PUBLIC_* values are inlined into the bundle at build time, but
            # SERVER-only secrets are read from the process environment at runtime.
            # Without them the service-role client cannot be constructed, so uploads,
            # the admin panel, moderation reports and terms-acceptance all fail.
            # Written 0600 and passed via --env-file so secrets never appear in
            # `docker inspect` or the process list.
            umask 077
            cat > "$APP_DIR/.env.production" <<'ENVEOF'
            NODE_ENV=production
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            NEXT_PUBLIC_SITE_URL=https://roomi.kz
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET }}
            SUPABASE_INTERNAL_URL=${{ secrets.SUPABASE_INTERNAL_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            APP_RELEASE=${{ github.sha }}
            ENVEOF
            chmod 600 "$APP_DIR/.env.production"
            # Drop keys whose secret was not configured, so an empty value never
            # shadows a sensible in-app default.
            sed -i -E '/^[A-Z_]+=$/d' "$APP_DIR/.env.production"

            # Default the storage bucket when the secret is unset (matches the app default).
            grep -q '^NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=' "$APP_DIR/.env.production" \
              || echo "NEXT_PUBLIC_SUPABASE_STORAGE_BUCKET=roommate-assets" >> "$APP_DIR/.env.production"

            # --- Internal Supabase route --------------------------------------
            # Server-side calls default to NEXT_PUBLIC_SUPABASE_URL, which
            # resolves to Cloudflare — so a request that could stay on this host
            # leaves it and comes back. Measured on this deployment:
            # /api/health went 233ms -> 12ms once it used the gateway directly.
            #
            # The explicit secret wins. When it is absent we self-configure, but
            # ONLY after proving this host actually runs the Supabase stack and
            # its gateway answers. Guessing a topology that isn't there would
            # point the app at a dead address and break every server render, so
            # the probe is the whole point. `curl` without -f treats Kong's 401
            # as success: an auth challenge proves it is listening.
            if ! grep -q '^SUPABASE_INTERNAL_URL=' "$APP_DIR/.env.production"; then
              if docker network inspect supabase_default >/dev/null 2>&1 \
                 && curl -sS -o /dev/null --max-time 3 http://127.0.0.1:8000/rest/v1/ >/dev/null 2>&1; then
                echo "SUPABASE_INTERNAL_URL=http://kong:8000" >> "$APP_DIR/.env.production"
                echo "Internal Supabase route enabled: kong:8000 answered."
              else
                echo "::notice::No local Supabase gateway detected; server-side calls will use the public URL (correct, just slower)."
              fi
            fi

            if ! grep -q '^SUPABASE_SERVICE_ROLE_KEY=' "$APP_DIR/.env.production"; then
              echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret is not set. Image uploads, the admin panel, moderation and terms-acceptance will fail until it is added."
            fi
            if ! grep -q '^ADMIN_EMAILS=' "$APP_DIR/.env.production"; then
              echo "::warning::ADMIN_EMAILS secret is not set. Admin access falls back to profiles.role / site_settings only."
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Remember what is serving right now. If the new release cannot pass
            # its health check we put this exact image back, rather than leaving
            # the site down until a human wakes up.
            PREV_IMAGE="$(docker inspect -f '{{.Config.Image}}' roomi-web 2>/dev/null || true)"
            echo "Currently running: ${PREV_IMAGE:-<nothing>}"

            # Pull BEFORE stopping anything: a registry failure must not take the
            # running site down.
            docker pull "$IMAGE"

            # start_app <image> — (re)creates the container with production
            # resource guards applied.
            #
            #   --memory / --pids-limit  bound the blast radius: this VPS also
            #     hosts the entire Supabase stack, so a leak or fork-bomb in the
            #     web tier must not OOM the database next to it.
            #   --log-opt                Docker's default json-file driver has NO
            #     size cap, so container logs grow until the disk fills and every
            #     service on the box fails at once.
            start_app() {
              docker run -d \
                --name roomi-web \
                --restart unless-stopped \
                --env-file "$APP_DIR/.env.production" \
                --memory 1g \
                --memory-swap 1g \
                --pids-limit 512 \
                --log-driver json-file \
                --log-opt max-size=20m \
                --log-opt max-file=5 \
                -p 127.0.0.1:3000:3000 \
                "$1"
            }

            # Keep the old container (stopped) instead of deleting it, so the
            # rollback path never depends on the registry being reachable.
            docker rm -f roomi-web-prev >/dev/null 2>&1 || true
            docker stop roomi-web >/dev/null 2>&1 || true
            docker rename roomi-web roomi-web-prev >/dev/null 2>&1 || true

            start_app "$IMAGE"

            # Attach to the Supabase network so SUPABASE_INTERNAL_URL (e.g.
            # http://kong:8000) can resolve. Additive — the container keeps its
            # bridge network and its published 127.0.0.1:3000 port. A no-op when
            # the network is absent, so this stays portable to hosts that run
            # Supabase elsewhere.
            docker network connect supabase_default roomi-web 2>/dev/null || true

            # --- Post-deploy verification -------------------------------------
            # Gate on LIVENESS (the new container boots and serves requests), not
            # on database reachability: a transient Supabase blip must not mark an
            # otherwise-good release as failed. Database health is still surfaced
            # below so degradation is visible in the deploy log.
            echo "Waiting for the app to answer /api/health..."
            HEALTH_BODY=""
            HEALTH_CODE=""
            for i in $(seq 1 30); do
              HEALTH_CODE="$(curl -sS -o /tmp/roomi-health.json -w '%{http_code}' --max-time 5 \
                http://127.0.0.1:3000/api/health 2>/dev/null || true)"
              HEALTH_BODY="$(cat /tmp/roomi-health.json 2>/dev/null || true)"
              case "$HEALTH_BODY" in
                *'"server":"ok"'*) break ;;
              esac
              HEALTH_BODY=""
              sleep 2
            done

            # --- Automatic rollback -------------------------------------------
            if [ -z "$HEALTH_BODY" ]; then
              echo "Deploy FAILED: the container never served a healthy response." >&2
              docker logs --tail 80 roomi-web >&2 || true

              if [ -n "$PREV_IMAGE" ]; then
                echo "::error::Rolling back to $PREV_IMAGE"
                docker rm -f roomi-web >/dev/null 2>&1 || true
                docker rename roomi-web-prev roomi-web >/dev/null 2>&1 || true
                docker start roomi-web || true

                for i in $(seq 1 20); do
                  if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
                    echo "::error::Rollback succeeded — site restored on the previous release. The new build was NOT deployed."
                    docker logout ghcr.io || true
                    exit 1
                  fi
                  sleep 2
                done
                echo "::error::ROLLBACK ALSO FAILED — the site is DOWN and needs manual attention." >&2
              else
                echo "::error::No previous container to roll back to." >&2
              fi
              docker logout ghcr.io || true
              exit 1
            fi

            echo "App is live (HTTP $HEALTH_CODE): $HEALTH_BODY"
            case "$HEALTH_BODY" in
              *'"database":"degraded"'*)
                echo "::warning::App is serving, but it cannot reach the database at NEXT_PUBLIC_SUPABASE_URL. Check that the container can resolve/reach the Supabase gateway."
                ;;
            esac

            # Healthy: retire the previous container. Its IMAGE is deliberately
            # kept (prune only removes untagged layers) so a manual rollback to
            # the prior SHA tag is still possible after this point.
            docker rm -f roomi-web-prev >/dev/null 2>&1 || true
            docker image prune -f
            docker logout ghcr.io || true

            echo "Deployed $IMAGE successfully."