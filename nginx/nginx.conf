user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  server_tokens   off;
  client_max_body_size 12m;   # room for image uploads

  # Compression
  gzip              on;
  gzip_vary         on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/rss+xml image/svg+xml font/woff2;

  upstream roomi_app {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Security and caching headers are set by the application (next.config.ts),
    # which is the single source of truth. nginx must NOT re-add them:
    # `add_header` appends rather than replaces, so duplicating them produced
    # two conflicting values per response (notably X-Frame-Options SAMEORIGIN
    # here vs. the app's stricter DENY) and a second Cache-Control on assets.
    #
    # Next already serves /_next/static with
    # `Cache-Control: public, max-age=31536000, immutable`, and pages with
    # `max-age=0, must-revalidate` so HTML can never outlive the build-hashed
    # assets it references.

    location /_next/static/ {
      proxy_pass http://roomi_app;
    }

    location /static/ {
      proxy_pass http://roomi_app;
    }

    location / {
      proxy_pass http://roomi_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 60s;
    }
  }
}
