[pytest]
; Makes `app.*` importable regardless of how pytest is invoked. Without this,
; `python -m pytest` happens to work (the -m flag prepends CWD to sys.path
; itself) while a bare `pytest` invocation — e.g. in CI — does not, since
; there's no tests/__init__.py for pytest's rootdir-based import to anchor on.
; See .github/workflows/deploy-telegram-service.yml.
pythonpath = .
